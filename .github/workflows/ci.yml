name: CI

# A cada push e pull request: compila e roda os testes (unit + integracao) e constroi a
# imagem Docker, sem publicar (a publicacao no GHCR vem com as tags de versao).
on:
  push:
  pull_request:

# Cancela execucoes antigas do mesmo ref quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Os testes de integracao usam EF InMemory; nenhum container e necessario.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Expense.Tracking.Identity.slnx

      - name: Build
        run: dotnet build Expense.Tracking.Identity.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Expense.Tracking.Identity.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=identity.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          if-no-files-found: ignore

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # So constroi: pega erro de Dockerfile antes da tag de versao.
      - name: Build
        run: docker build --tag expense-identity:ci .

  # IDX-6: contrato OIDC de caixa-preta contra o Identity real (imagem deste commit + MySQL).
  contract:
    name: oidc contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Subir Identity + MySQL
        run: docker compose -f tests/contract/docker-compose.yml up -d --build

      - name: Esperar o Identity
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5081/health/ready >/dev/null && exit 0
            sleep 3
          done
          echo "Identity nao ficou pronto" >&2
          exit 1

      - name: Contrato OIDC
        env:
          IDENTITY_CONTRACT_BASE_URL: http://localhost:5081
        run: dotnet test tests/Expense.Tracking.Identity.ContractTests --configuration Release

      - name: Logs (em falha)
        if: failure()
        run: docker compose -f tests/contract/docker-compose.yml logs --no-color identity

      - name: Derrubar
        if: always()
        run: docker compose -f tests/contract/docker-compose.yml down -v
