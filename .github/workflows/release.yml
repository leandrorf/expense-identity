name: Release

# IDX-4 (ADR-0003 do expense.tracking): cada tag vX.Y.Z publica a imagem
# ghcr.io/<dono>/expense-identity:X.Y.Z. Sem tag "latest": quem consome fixa a versao exata.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag da imagem = versao sem o "v"; rotulos OCI de origem, versao e revisao.
      - name: Metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/expense-identity
          tags: type=semver,pattern={{version}}
          flavor: latest=false

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
